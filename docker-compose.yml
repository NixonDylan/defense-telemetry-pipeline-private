version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: telemetry_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: telemetry_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: telemetry_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:securepassword123@db:5432/telemetry_prod
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
