version: '3.8'

services:
  # --- Database Layer ---
  db:
    image: postgres:15-alpine
    container_name: defense_telemetry_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: telemetry_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - telemetry_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Secure API Gateway Microservice ---
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defense_telemetry_gateway
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=telemetry_db
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - telemetry_network

volumes:
  postgres_data:

networks:
  telemetry_network:
    driver: bridge
