name: DevSecOps Unified CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  quality-and-testing:
    name: Code Quality & Baseline Testing
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secure_db_pass_change_me
          POSTGRES_DB: telemetry_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System and Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libpq-dev
          python -m pip install --upgrade pip
          # Standard ingestion environment variables from original repo
          pip install polars psycopg[pool] pydantic celery redis pytest

      - name: Execute Original Pipeline Test Suite
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql://postgres:secure_db_pass_change_me@localhost:5432/telemetry_db
        run: |
          # Verifies your original code using its initial baseline payloads
          pytest test_pipeline.py -v
  
      - name: Execute ERDDAP Metadata Configuration Validation
        run: |
          # Calls your new automated cloud validator explicitly
          pytest tests/test_erddap_config.py -v
