name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # --- Stage 1: Quality Assurance & Code Scanning ---
  quality-and-security:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pytest httpx python-jose[cryptography] pydantic-settings
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff Linter (Style & Code Cleanliness)
        run: ruff check app/

      - name: Run Mypy (Static Type Safety Enforcement)
        run: mypy app/ --ignore-missing-imports

      - name: Run Bandit (AST Security Vulnerability Audit)
        run: bandit -r app/ -ll -c pyproject.toml || bandit -r app/ -ll

      - name: Run Standard Unit Tests
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          # This automatically skips stress_load_run.py due to our pytest.ini setup
          pytest

  # --- Stage 2: Hardened Build & Artifact Distribution ---
  build-and-publish:
    name: Container Hardening & GHCR Deployment
    needs: quality-and-security
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/telemetry-api-gateway
          tags: |
            type=sha,format=long
            type=ref,event=branch
            latest

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true # Loads image locally into the runner environment for testing
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy Vulnerability Scanner (Container Image Audit)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/telemetry-api-gateway:latest
          format: 'table'
          exit-code: '1' # Fails the pipeline build if Critical/High vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Hardened Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
